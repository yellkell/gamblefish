<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gamble Fish: the Island Bank</title>
    <meta name="theme-color" content="#0c1418" />
    <!-- Where Stripe Checkout lands you after paying (or backing out): a thank-you
         and nothing else. The coins are credited by the webhook and claimed by the
         headset; this page has no part in that. -->
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0c1418; color: #eaf4f8; font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; display: grid; place-items: center; text-align: center; }
      main { padding: 32px 24px; max-width: 520px; }
      h1 { color: #d8b060; letter-spacing: 0.08em; font-size: 2rem; }
      p { color: rgba(234, 244, 248, 0.85); line-height: 1.6; }
      a { color: #3fd6c6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <section id="paid">
        <h1>PAID</h1>
        <p>Thank you. Your coins are on their way to the headset: they land in your wallet at the Island Bank within a few seconds, or the next time the game starts.</p>
        <p>You can close this page.</p>
      </section>
      <section id="cancel" hidden>
        <h1>NO CHARGE</h1>
        <p>The checkout was cancelled and nothing was taken.</p>
      </section>
      <p><a href="terms.html">terms of purchase</a> · <a href="privacy.html">privacy</a></p>
    </main>
    <script>
      if (new URLSearchParams(location.search).get('cancel') === '1') {
        document.getElementById('paid').hidden = true;
        document.getElementById('cancel').hidden = false;
      }
    </script>
  </body>
</html>
